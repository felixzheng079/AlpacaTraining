[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alpaca-training"
version = "0.1.0"
description = "Pluggable automated trading system for Alpaca"
requires-python = ">=3.11"
dependencies = [
    "lumibot>=3.4",
    "click>=8.0",
    "fastapi>=0.100",
    "uvicorn>=0.30",
    "alpaca-py>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
alpaca-training = "alpaca_training.cli:cli"

[tool.pytest.ini_options]
markers = [
    "slow: marks tests that require network access (backtesting, live data)",
]
